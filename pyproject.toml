[project]
name = "clock-of-your-life"
version = "0.1.0"
description = "Visualize remaining time in your life"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pyinstaller>=6.0",
    "watchfiles>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cyl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
cyl = "cyl.__main__:main"
